<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅行手帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4EEE0;
    --bg-alt:#EAE1C9;
    --ink:#2A2016;
    --ink-soft:#6E5F4D;
    --line:#2A2016;
    --vermillion:#B23A2A;
    --vermillion-soft:#E9CFC6;
    --jade:#2E6B58;
    --jade-soft:#D9E6DC;
    --brass:#B8862E;
    --brass-soft:#F1E1B8;
    --card:#FFFCF4;
    --shadow:0 3px 0 rgba(42,32,22,0.9);
    --radius:16px;
  }
  *{box-sizing:border-box;}
  body{margin:0;}
  html,body{
    background:var(--bg);
    color:var(--ink);
    font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:100px;background:
    linear-gradient(180deg, var(--bg) 0%, var(--bg) 100%);
    position:relative;
  }
  /* ===== header ===== */
  .hero{
    padding:28px 20px 18px;
    border-bottom:2px solid var(--line);
    background:var(--bg);
    position:relative;
  }
  .hero-eyebrow{
    display:inline-flex;align-items:center;gap:6px;
    font-family:"Noto Serif TC",serif;font-weight:900;font-size:12px;
    background:var(--vermillion);color:#fff;padding:4px 10px 5px;
    border-radius:999px;letter-spacing:2px;
  }
  .hero h1{
    font-family:"Noto Serif TC",serif;font-weight:900;
    font-size:32px;line-height:1.25;margin:10px 0 6px;
    border:none;background:transparent;color:var(--ink);width:100%;padding:0;
    outline:none;
  }
  .hero h1 span.accent{color:var(--vermillion);}
  .hero-sub{
    font-size:13px;color:var(--ink-soft);line-height:1.7;
    border:none;background:transparent;width:100%;resize:none;padding:0;
    outline:none;font-family:inherit;
  }
  .base-note{
    margin-top:14px;background:var(--ink);color:#F4EEE0;border-radius:14px;
    padding:14px 16px;font-size:13px;line-height:1.7;display:flex;gap:10px;
  }
  .base-note .icon{font-size:16px;flex:none;}
  .base-note textarea{
    background:transparent;border:none;color:inherit;width:100%;resize:none;
    font-family:inherit;font-size:inherit;line-height:inherit;outline:none;
  }
  .base-note b{color:var(--brass-soft);}

  /* ===== tabs ===== */
  .tabbar{
    display:flex;gap:10px;overflow-x:auto;padding:16px 20px 12px;
    border-bottom:2px solid var(--line);
    scrollbar-width:none;
  }
  .tabbar::-webkit-scrollbar{display:none;}
  .tab{
    flex:none;width:74px;height:74px;border:2px solid var(--line);border-radius:16px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--card);cursor:pointer;box-shadow:var(--shadow);
    transition:transform .12s ease;
    position:relative;
  }
  .tab:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(42,32,22,0.9);}
  .tab .num{font-family:"Noto Serif TC",serif;font-weight:900;font-size:20px;}
  .tab .label{font-size:10px;color:var(--ink-soft);margin-top:2px;letter-spacing:1px;}
  .tab.active{background:var(--vermillion);border-color:var(--vermillion);color:#fff;}
  .tab.active .label{color:#F4DCD6;}
  .tab.money{background:var(--jade);border-color:var(--jade);color:#fff;}
  .tab.money .label{color:#DCEDE3;}
  .tab.money.active{background:var(--vermillion);border-color:var(--vermillion);}
  .tab.bag{border-style:dashed;}
  .tab-del{
    position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;
    background:var(--ink);color:#fff;border:2px solid var(--bg);font-size:11px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .tab-add{
    flex:none;width:74px;height:74px;border:2px dashed var(--ink-soft);border-radius:16px;
    display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--ink-soft);
    background:transparent;cursor:pointer;
  }

  /* ===== content ===== */
  .content{padding:22px 20px 30px;}
  .section-title{
    font-family:"Noto Serif TC",serif;font-weight:900;font-size:22px;
    margin:0 0 4px;display:flex;align-items:center;gap:8px;
  }
  .section-title .bar{width:5px;height:20px;background:var(--vermillion);border-radius:3px;}
  .section-desc{font-size:12.5px;color:var(--ink-soft);margin:0 0 16px;line-height:1.7;}

  /* ---- day meta editable row ---- */
  .day-meta{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  .pill-input{
    border:2px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;
    background:var(--card);font-family:inherit;color:var(--ink);
  }
  .pill-input.date{width:110px;}
  .pill-input.title{flex:1;min-width:140px;font-weight:700;}

  .stat-row{
    display:flex;border:2px solid var(--line);border-radius:14px;overflow:hidden;
    margin-bottom:18px;background:var(--card);box-shadow:var(--shadow);
  }
  .stat{flex:1;padding:14px;text-align:center;}
  .stat + .stat{border-left:2px solid var(--line);}
  .stat .k{font-size:11px;color:var(--ink-soft);margin-bottom:4px;}
  .stat .v{font-family:"Noto Serif TC",serif;font-weight:900;font-size:20px;color:var(--vermillion);}

  /* ---- timeline ---- */
  .timeline{display:flex;flex-direction:column;gap:0;}
  .transport-row{
    display:flex;align-items:center;gap:10px;padding:10px 4px 10px 6px;font-size:13px;
    color:var(--ink-soft);border-bottom:1px dashed #cabf9f;
  }
  .transport-row .ic{font-size:17px;}
  .transport-row .mode{font-weight:700;color:var(--ink);}
  .transport-row .from-to{flex:1;}
  .transport-row input{border:none;background:transparent;font-family:inherit;color:inherit;outline:none;}
  .transport-row .num-input{width:44px;text-align:right;font-weight:700;color:var(--ink);}
  .transport-row .unit{font-size:11px;}
  .transport-row .del{cursor:pointer;color:var(--vermillion);font-size:15px;padding:0 2px;}

  .stop-card{
    border:2px solid var(--line);border-radius:16px;background:var(--card);
    padding:16px;margin:10px 0 22px;position:relative;box-shadow:var(--shadow);
  }
  .stop-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .stop-time{
    border:2px solid var(--line);border-radius:10px;padding:6px 10px;font-family:"Noto Serif TC",serif;
    font-weight:900;font-size:17px;width:78px;text-align:center;background:var(--bg);
  }
  .tag{
    font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;flex:none;white-space:nowrap;
  }
  .tag-select{border:none;-webkit-appearance:none;appearance:none;font-family:inherit;cursor:pointer;}
  .stop-title{
    flex:1;font-size:17px;font-weight:700;border:none;background:transparent;
    font-family:"Noto Serif TC",serif;outline:none;color:var(--ink);min-width:0;
  }
  .stop-del{color:var(--vermillion);font-size:16px;cursor:pointer;flex:none;}
  .stop-desc{
    width:100%;border:none;background:var(--bg-alt);border-radius:10px;padding:10px 12px;
    font-size:13px;line-height:1.7;color:var(--ink);resize:none;font-family:inherit;outline:none;
    margin-bottom:10px;
  }
  .stop-meta{display:flex;gap:8px;flex-wrap:wrap;}
  .chip-input{
    display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;
    padding:6px 12px;font-size:12px;background:var(--bg);flex:1;min-width:130px;
  }
  .chip-input input{border:none;background:transparent;outline:none;font-family:inherit;font-size:inherit;color:var(--ink);width:100%;}

  .add-row{display:flex;gap:8px;margin:12px 0 26px;}
  .btn{
    border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:13px;font-weight:700;
    background:var(--card);cursor:pointer;font-family:inherit;color:var(--ink);
    display:flex;align-items:center;gap:6px;box-shadow:var(--shadow);
  }
  .btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(42,32,22,0.9);}
  .btn.ghost{background:transparent;box-shadow:none;}
  .btn.jade{background:var(--jade);color:#fff;border-color:var(--jade);}
  .btn.vermillion{background:var(--vermillion);color:#fff;border-color:var(--vermillion);}
  .btn.block{width:100%;justify-content:center;}
  .btn.sm{padding:7px 10px;font-size:12px;}

  /* ---- flights ---- */
  .flight-card{
    border:2px solid var(--line);border-radius:16px;background:var(--card);padding:18px;
    margin-bottom:18px;box-shadow:var(--shadow);
  }
  .flight-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .flight-head .ttl{font-family:"Noto Serif TC",serif;font-weight:900;font-size:18px;display:flex;align-items:center;gap:8px;}
  .flight-head .badge{background:var(--jade-soft);color:var(--jade);font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;}
  .field-label{font-size:11px;color:var(--ink-soft);margin:10px 0 5px;}
  .field-input{
    width:100%;border:2px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px;
    font-family:inherit;background:var(--bg);color:var(--ink);outline:none;
  }
  .two-col{display:flex;gap:10px;}
  .two-col > div{flex:1;}
  .airport-row{display:flex;align-items:center;gap:8px;}
  .airport-row .arrow{color:var(--vermillion);font-size:18px;}

  /* ---- luggage ---- */
  .lug-group{margin-bottom:20px;}
  .lug-group h3{
    font-family:"Noto Serif TC",serif;font-size:15px;margin:0 0 8px;color:var(--vermillion);
    display:flex;align-items:center;gap:6px;
  }
  .lug-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border:2px solid var(--line);
    border-radius:12px;background:var(--card);margin-bottom:8px;
  }
  .lug-item.checked{background:var(--jade-soft);border-color:var(--jade);}
  .lug-item .box{
    width:20px;height:20px;border:2px solid var(--line);border-radius:6px;flex:none;cursor:pointer;
    display:flex;align-items:center;justify-content:center;font-size:13px;background:#fff;
  }
  .lug-item.checked .box{background:var(--jade);border-color:var(--jade);color:#fff;}
  .lug-item input{
    flex:1;border:none;background:transparent;font-family:inherit;font-size:14px;outline:none;color:var(--ink);
  }
  .lug-item.checked input{text-decoration:line-through;color:var(--ink-soft);}
  .lug-item .del{color:var(--vermillion);cursor:pointer;font-size:14px;}
  .lug-add{display:flex;gap:8px;}
  .lug-add input{flex:1;}

  /* ---- billing ---- */
  .sync-badge{
    border:2px solid var(--jade);color:var(--jade);border-radius:14px;padding:14px;
    text-align:center;font-weight:700;font-size:14px;margin-bottom:14px;background:var(--jade-soft);
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  .member-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .member-pill{
    display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;
    padding:7px 12px 7px 14px;background:var(--bg-alt);font-size:13px;font-weight:700;
  }
  .member-pill .x{
    width:16px;height:16px;border-radius:50%;background:var(--vermillion);color:#fff;font-size:10px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .member-add{display:flex;gap:8px;margin-bottom:22px;}
  .member-add input{flex:1;}

  .fam-card{
    border:2px solid var(--line);border-radius:14px;background:var(--card);padding:14px 16px;
    margin-bottom:10px;box-shadow:var(--shadow);
  }
  .fam-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .fam-name{font-family:"Noto Serif TC",serif;font-weight:900;font-size:16px;display:flex;align-items:center;gap:8px;}
  .fam-name .cnt{font-size:11px;font-weight:400;background:var(--brass-soft);color:var(--brass);padding:3px 8px;border-radius:999px;}
  .fam-fields{display:flex;gap:10px;}
  .fam-fields > div{flex:1;}
  .fam-fields label{font-size:10px;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .fam-fields input{width:100%;border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-family:inherit;font-size:14px;background:var(--bg);}

  .expense-row{
    border:2px solid var(--line);border-radius:14px;background:var(--card);padding:12px 14px;
    margin-bottom:10px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow);
  }
  .expense-row .r1{display:flex;gap:8px;}
  .expense-row .r1 input[type=text]{flex:2;}
  .expense-row .r1 input[type=number]{flex:1;text-align:right;}
  .expense-row select{
    border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-family:inherit;background:var(--bg);font-size:13px;
  }
  .expense-row input{border:2px solid var(--line);border-radius:10px;padding:8px 10px;font-family:inherit;font-size:13px;background:var(--bg);color:var(--ink);}
  .expense-row .r2{display:flex;gap:8px;align-items:center;}
  .expense-row .del{color:var(--vermillion);cursor:pointer;font-size:14px;margin-left:auto;}

  .settle-card{
    border:2px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card);
    margin:18px 0;box-shadow:var(--shadow);
  }
  .settle-head{background:var(--ink);color:var(--bg);padding:12px 16px;font-family:"Noto Serif TC",serif;font-weight:900;font-size:15px;}
  .settle-row{
    display:flex;justify-content:space-between;align-items:center;padding:12px 16px;
    border-top:1px dashed #cabf9f;font-size:13px;
  }
  .settle-row .nm{font-weight:700;}
  .settle-row .amt{font-family:"Noto Serif TC",serif;font-weight:900;font-size:15px;}
  .amt.refund{color:var(--jade);}
  .amt.owe{color:var(--vermillion);}

  .totals{display:flex;gap:10px;margin-bottom:6px;}
  .totals .stat .v{color:var(--jade);}

  /* ---- stamp fab ---- */
  .stamp{
    position:fixed;bottom:26px;right:calc(50% - 260px + 20px);
    width:56px;height:56px;border-radius:50%;
    background:var(--vermillion);color:#fff;border:3px solid var(--card);
    font-family:"Noto Serif TC",serif;font-weight:900;font-size:20px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 10px rgba(42,32,22,.35);cursor:pointer;
    transform:rotate(-8deg);transition:transform .15s ease;
    z-index:50;
  }
  @media (max-width:560px){
    .stamp{right:20px;}
  }
  .stamp:active{transform:rotate(-8deg) scale(.9);}
  .stamp.on{background:var(--jade);}
  .toast{
    position:fixed;bottom:96px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:12.5px;
    opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:60;white-space:nowrap;
  }
  .toast.show{opacity:1;}

  .empty{
    text-align:center;color:var(--ink-soft);font-size:13px;padding:30px 10px;border:2px dashed var(--ink-soft);
    border-radius:14px;
  }
</style>
</head>
<body>
<div id="app">
  <div class="hero">
    <span class="hero-eyebrow" id="dayCountBadge">5 DAYS</span>
    <input id="tripTitle" class="hero-title-input" style="display:none">
    <h1 id="tripTitleView" contenteditable="false"></h1>
    <textarea id="tripSub" class="hero-sub" rows="2"></textarea>
    <div class="base-note">
      <div class="icon">🏨</div>
      <div style="width:100%">
        <b>住宿基地：</b>
        <textarea id="baseNote" rows="2"></textarea>
      </div>
    </div>
  </div>

  <div class="tabbar" id="tabbar"></div>
  <div class="content" id="content"></div>
</div>

<div class="stamp" id="stampBtn" title="編輯模式">編</div>
<div class="toast" id="toast"></div>

<script>
/* ============ 資料模型 ============ */
const CN_NUM = ["","壹","貳","參","肆","伍","陸","柒","捌","玖","拾"];
const CATS = [
  {v:"景點",bg:"var(--vermillion-soft)",fg:"var(--vermillion)"},
  {v:"批發市場",bg:"var(--jade-soft)",fg:"var(--jade)"},
  {v:"批發街",bg:"var(--jade-soft)",fg:"var(--jade)"},
  {v:"餐廳",bg:"var(--brass-soft)",fg:"var(--brass)"},
  {v:"住宿",bg:"#E4DCEE",fg:"#6B4E9B"},
  {v:"其他",bg:"var(--bg-alt)",fg:"var(--ink-soft)"}
];
const TMODES = [
  {v:"打車",ic:"🚕"},{v:"步行",ic:"🚶"},{v:"地鐵",ic:"🚇"},{v:"公車",ic:"🚌"},{v:"高鐵",ic:"🚄"}
];

function uid(){ return Math.random().toString(36).slice(2,9); }

function defaultState(){
  return {
    meta:{
      title:"嗚啦啦廣州順德之旅",
      sub:"2026.09.24 – 09.28　老城騎樓 × 批發淘貨 × 佛山順德 × 小蠻腰快閃 — 全程以打車／地鐵移動",
      base:"北京路步行街／吾悅廣場民宿，4晚皆以此為出發與回程點。"
    },

      out:{date:"2026-09-24",from:"臺灣桃園國際機場 T1",to:"香港國際機場 T1",dep:"10:50",arr:"13:00",airline:"國泰航空 CX489",note:"轉機約 1 小時 20 分鐘"},
      in:{date:"2026-09-28",from:"香港國際機場 T1",to:"臺灣桃園國際機場 T1",dep:"18:30",arr:"20:20",airline:"國泰航空 CX488",note:""}
    },
    days:[
      {id:uid(),date:"09/24",title:"抵達・老城騎樓漫走",items:[]},

        {type:"transport",id:uid(),mode:"打車",from:"民宿",to:"白馬服裝市場",dur:"15",cost:"20"},
        {type:"stop",id:uid(),time:"09:00",cat:"批發市場",title:"白馬服裝市場",desc:"廣州最具代表性的服裝批發市場之一，交易量最大、走中高端路線，營業約08:00–18:00。樓層攻略：1樓精品高端女裝，4、5樓款式與質量最好但價位也最高，6樓主要批發男裝；主打大衣、羽絨服、洋裝、針織衫。建議越早去越好逛，議價空間也較大。",addr:"廣州市越秀區站南路16號"},
        {type:"transport",id:uid(),mode:"打車",from:"白馬市場",to:"十三行批發城",dur:"12",cost:"16"},
        {type:"stop",id:uid(),time:"11:30",cat:"批發市場",title:"十三行批發城",desc:"",addr:""},
        {type:"transport",id:uid(),mode:"步行",from:"十三行",to:"一德路",dur:"8",cost:"0"},
        {type:"stop",id:uid(),time:"13:30",cat:"批發街",title:"一德路",desc:"",addr:""},
        {type:"transport",id:uid(),mode:"打車",from:"一德路",to:"三元里／白雲皮具市場",dur:"20",cost:"25"},
        {type:"stop",id:uid(),time:"15:00",cat:"批發市場",title:"三元里／白雲皮具市場",desc:"",addr:""}
      ]},
      {id:uid(),date:"09/28",title:"小蠻腰・賦歸",items:[]}
    ],
    luggage:[
      {id:uid(),group:"證件與金錢",item:"護照 / 台胞證",checked:false},
      {id:uid(),group:"證件與金錢",item:"人民幣現金 / 支付寶",checked:false},
      {id:uid(),group:"3C與行動電源",item:"手機充電線",checked:false},
      {id:uid(),group:"3C與行動電源",item:"行動電源（隨身，不可托運）",checked:false},
      {id:uid(),group:"衣物",item:"薄外套",checked:false}
    ],
    billing:{
      members:[
        {id:uid(),name:"林家",count:4,deposit:0},
        {id:uid(),name:"吳家",count:2,deposit:0},
        {id:uid(),name:"伍家",count:2,deposit:0}
      ],
      expenses:[]
    }
  };
}

let state = null;
let tab = "flights"; // "flights" | dayId | "luggage" | "billing"
let editMode = false;
const STORE_KEY = "trip-data-v1";

/* ============ 存取 ============ */
// 這個網頁可能跑在兩種環境：
// 1) Claude 的 artifact 預覽視窗 → 有 window.storage，可雲端同步
// 2) 匯出後自架網站 / GitHub Pages → 沒有 window.storage，改用瀏覽器 localStorage（僅存在你自己的裝置上，不會同步給別人）
const HAS_CLOUD_STORAGE = (typeof window.storage !== "undefined" && window.storage && typeof window.storage.get === "function");

async function load(){
  try{
    if(HAS_CLOUD_STORAGE){
      const r = await window.storage.get(STORE_KEY, true);
      state = r ? JSON.parse(r.value) : defaultState();
    }else{
      const raw = localStorage.getItem(STORE_KEY);
      state = raw ? JSON.parse(raw) : defaultState();
    }
  }catch(e){
    state = defaultState();
  }
  render();
}
let saveTimer=null;
function save(msg){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      if(HAS_CLOUD_STORAGE){
        await window.storage.set(STORE_KEY, JSON.stringify(state), true);
      }else{
        localStorage.setItem(STORE_KEY, JSON.stringify(state));
      }
      if(msg) showToast(msg);
    }catch(e){
      showToast("儲存失敗，請檢查瀏覽器儲存空間");
    }
  }, 250);
}
function showToast(t){
  const el = document.getElementById("toast");
  el.textContent = t;
  el.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>el.classList.remove("show"), 1400);
}

/* ============ 小工具 ============ */
function catStyle(cat){
  const c = CATS.find(x=>x.v===cat) || CATS[CATS.length-1];
  return `background:${c.bg};color:${c.fg}`;
}
function fmtMoney(n){
  n = Number(n)||0;
  return (n<0?"-¥":"¥") + Math.abs(n).toLocaleString("zh-Hant",{maximumFractionDigits:0});
}

/* ============ 渲染：頂層 ============ */
function render(){
  document.getElementById("dayCountBadge").textContent = state.days.length + " DAYS";
  document.getElementById("tripTitleView").innerHTML = escapeHtml(state.meta.title);
  document.getElementById("tripSub").value = state.meta.sub;
  document.getElementById("baseNote").value = state.meta.base;
  document.getElementById("tripSub").readOnly = !editMode;
  document.getElementById("baseNote").readOnly = !editMode;
  document.getElementById("tripTitleView").contentEditable = editMode ? "true":"false";

  renderTabs();
  renderContent();
  document.getElementById("stampBtn").classList.toggle("on", editMode);
}

function escapeHtml(s){
  return (s||"").replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
}

function renderTabs(){
  const bar = document.getElementById("tabbar");
  let html = `<div class="tab ${tab==='flights'?'active':''}" onclick="setTab('flights')">
      <div class="num" style="font-size:22px">✈️</div><div class="label">航班</div>
    </div>`;
  state.days.forEach((d,i)=>{
    html += `<div class="tab ${tab===d.id?'active':''}" onclick="setTab('${d.id}')" style="position:relative">
        ${editMode && state.days.length>1 ? `<div class="tab-del" onclick="event.stopPropagation();delDay('${d.id}')">✕</div>`:""}
        <div class="num">${CN_NUM[i+1]||(i+1)}</div><div class="label">DAY ${i+1}</div>
      </div>`;
  });
  html += `<div class="tab bag ${tab==='luggage'?'active':''}" onclick="setTab('luggage')">
      <div class="num" style="font-size:20px">🎒</div><div class="label">行李</div>
    </div>`;
  html += `<div class="tab money ${tab==='billing'?'active':''}" onclick="setTab('billing')">
      <div class="num" style="font-size:20px">💰</div><div class="label">分帳</div>
    </div>`;
  if(editMode){
    html += `<div class="tab-add" onclick="addDay()">＋</div>`;
  }
  bar.innerHTML = html;
}

function setTab(t){ tab = t; render(); }

function renderContent(){
  const c = document.getElementById("content");
  if(tab==="flights") c.innerHTML = flightsView();
  else if(tab==="luggage") c.innerHTML = luggageView();
  else if(tab==="billing") c.innerHTML = billingView();
  else c.innerHTML = dayView(tab);
}

    return `
    <div class="flight-card">
      <div class="flight-head">
        <div class="ttl">✈️ ${label}</div>
        <div class="badge">${badge}</div>
      </div>
      <div class="field-label">日期</div>
      <input class="field-input" type="date" value="${v.date}" onchange="f_upd('${key}','date',this.value)" ${dis()}>
      <div class="field-label">機場</div>
      <div class="airport-row">
        <input class="field-input" value="${escapeHtml(v.from)}" onchange="f_upd('${key}','from',this.value)" ${dis()}>
        <div class="arrow">→</div>
        <input class="field-input" value="${escapeHtml(v.to)}" onchange="f_upd('${key}','to',this.value)" ${dis()}>
      </div>
      <div class="two-col">
        <div>
          <div class="field-label">出發時間</div>
          <input class="field-input" type="time" value="${v.dep}" onchange="f_upd('${key}','dep',this.value)" ${dis()}>
        </div>
        <div>
          <div class="field-label">抵達時間</div>
          <input class="field-input" type="time" value="${v.arr}" onchange="f_upd('${key}','arr',this.value)" ${dis()}>
        </div>
      </div>
      <div class="field-label">航空公司／航班號</div>
      <input class="field-input" value="${escapeHtml(v.airline)}" onchange="f_upd('${key}','airline',this.value)" ${dis()}>
      <div class="field-label">備註</div>
      <input class="field-input" value="${escapeHtml(v.note)}" onchange="f_upd('${key}','note',this.value)" ${dis()}>
    </div>`;
  };
  return `
    <div class="section-title"><span class="bar"></span>航班資訊</div>
    <p class="section-desc">去程／回程皆可點擊修改</p>
    ${leg("out","去程","出發")}
    ${leg("in","回程","返程")}
  `;
}
function dis(){ return editMode ? "" : ""; } // fields always editable; kept for future lock toggle
function f_upd(key, field, val){
  state.flights[key][field] = val;
  save();
}

/* ============ 每日行程 ============ */
function dayView(dayId){
  const d = state.days.find(x=>x.id===dayId);
  if(!d) return `<div class="empty">找不到這一天</div>`;
  const stops = d.items.filter(i=>i.type==="stop").length;
  const cost = d.items.filter(i=>i.type==="transport").reduce((s,i)=>s+(Number(i.cost)||0),0);
  const dur = d.items.filter(i=>i.type==="transport").reduce((s,i)=>s+(Number(i.dur)||0),0);

  let html = `
    <div class="day-meta">
      <input class="pill-input date" value="${escapeHtml(d.date)}" onchange="d_upd('${d.id}','date',this.value)">
      <input class="pill-input title" value="${escapeHtml(d.title)}" onchange="d_upd('${d.id}','title',this.value)" placeholder="這天的主題...">
    </div>
    <div class="stat-row">
      <div class="stat"><div class="k">景點站數</div><div class="v">${stops}</div></div>
      <div class="stat"><div class="k">交通時間</div><div class="v">${dur}分</div></div>
      <div class="stat"><div class="k">交通花費</div><div class="v">¥${cost}</div></div>
    </div>
    <div class="timeline">
  `;
  if(d.items.length===0){
    html += `<div class="empty">這天還沒有安排行程<br>點下方按鈕新增第一個景點吧</div>`;
  }
  d.items.forEach(it=>{
    if(it.type==="transport") html += transportRow(d.id, it);
    else html += stopCard(d.id, it);
  });
  html += `</div>
    <div class="add-row">
      <div class="btn" onclick="addStop('${d.id}')">📍 新增景點</div>
      <div class="btn ghost" onclick="addTransport('${d.id}')">🚕 新增交通</div>
    </div>
  `;
  return html;
}
function d_upd(dayId, field, val){
  const d = state.days.find(x=>x.id===dayId);
  d[field]=val; save();
}

function transportRow(dayId, it){
  const opts = TMODES.map(m=>`<option value="${m.v}" ${m.v===it.mode?"selected":""}>${m.ic} ${m.v}</option>`).join("");
  const ic = (TMODES.find(m=>m.v===it.mode)||{ic:"🚕"}).ic;
  return `
  <div class="transport-row">
    <div class="ic">${ic}</div>
    <select onchange="it_upd('${dayId}','${it.id}','mode',this.value)" style="border:none;background:transparent;font-family:inherit;font-weight:700;color:var(--ink);">
      ${opts}
    </select>
    <input class="from-to" value="${escapeHtml(it.from)}" placeholder="出發地" onchange="it_upd('${dayId}','${it.id}','from',this.value)">
    <span>→</span>
    <input class="from-to" value="${escapeHtml(it.to)}" placeholder="目的地" onchange="it_upd('${dayId}','${it.id}','to',this.value)">
    <input class="num-input" type="number" value="${it.dur}" onchange="it_upd('${dayId}','${it.id}','dur',this.value)"><span class="unit">分</span>
    <input class="num-input" type="number" value="${it.cost}" onchange="it_upd('${dayId}','${it.id}','cost',this.value)"><span class="unit">¥</span>
    ${editMode?`<div class="del" onclick="delItem('${dayId}','${it.id}')">✕</div>`:""}
  </div>`;
}

function stopCard(dayId, it){
  const catOpts = CATS.map(c=>`<option value="${c.v}" ${c.v===it.cat?"selected":""}>${c.v}</option>`).join("");
  return `
  <div class="stop-card">
    <div class="stop-top">
      <input class="stop-time" value="${escapeHtml(it.time)}" onchange="it_upd('${dayId}','${it.id}','time',this.value)">
      <select class="tag tag-select" style="${catStyle(it.cat)}" onchange="it_upd('${dayId}','${it.id}','cat',this.value)">${catOpts}</select>
      <input class="stop-title" value="${escapeHtml(it.title)}" placeholder="景點名稱" onchange="it_upd('${dayId}','${it.id}','title',this.value)">
      ${editMode?`<div class="stop-del" onclick="delItem('${dayId}','${it.id}')">✕</div>`:""}
    </div>
    <textarea class="stop-desc" rows="3" placeholder="簡介／備註..." onchange="it_upd('${dayId}','${it.id}','desc',this.value)">${escapeHtml(it.desc)}</textarea>
    <div class="stop-meta">
      <div class="chip-input">📍 <input value="${escapeHtml(it.addr)}" placeholder="地址" onchange="it_upd('${dayId}','${it.id}','addr',this.value)"></div>
    </div>
  </div>`;
}

function it_upd(dayId, itemId, field, val){
  const d = state.days.find(x=>x.id===dayId);
  const it = d.items.find(x=>x.id===itemId);
  it[field]=val; save();
  if(field==="cat") render();
  if(field==="mode") render();
}
function delItem(dayId, itemId){
  const d = state.days.find(x=>x.id===dayId);
  d.items = d.items.filter(x=>x.id!==itemId);
  save("已刪除"); render();
}
function addStop(dayId){
  const d = state.days.find(x=>x.id===dayId);
  d.items.push({type:"stop",id:uid(),time:"09:00",cat:"景點",title:"",desc:"",addr:""});
  save(); render();
}
function addTransport(dayId){
  const d = state.days.find(x=>x.id===dayId);
  d.items.push({type:"transport",id:uid(),mode:"打車",from:"",to:"",dur:"10",cost:"0"});
  save(); render();
}
function addDay(){
  state.days.push({id:uid(),date:"",title:"新的一天",items:[]});
  tab = state.days[state.days.length-1].id;
  save(); render();
}
function delDay(dayId){
  if(!confirm("確定要刪除這一天的行程嗎？")) return;
  state.days = state.days.filter(x=>x.id!==dayId);
  if(tab===dayId) tab = "flights";
  save("已刪除"); render();
}

/* ============ 行李 ============ */
function luggageView(){
  const groups = {};
  state.luggage.forEach(it=>{
    groups[it.group] = groups[it.group]||[];
    groups[it.group].push(it);
  });
  let html = `<div class="section-title"><span class="bar"></span>行李清單</div>
    <p class="section-desc">打包好了就打勾，出發前再檢查一次</p>`;
  Object.keys(groups).forEach(g=>{
    html += `<div class="lug-group"><h3>${escapeHtml(g)}</h3>`;
    groups[g].forEach(it=>{
      html += `<div class="lug-item ${it.checked?'checked':''}">
        <div class="box" onclick="toggleLug('${it.id}')">${it.checked?'✓':''}</div>
        <input value="${escapeHtml(it.item)}" onchange="lug_upd('${it.id}','item',this.value)">
        ${editMode?`<div class="del" onclick="delLug('${it.id}')">✕</div>`:""}
      </div>`;
    });
    html += `</div>`;
  });
  html += `
    <div class="lug-add">
      <input class="field-input" id="newLugGroup" placeholder="分類，例如：3C與行動電源">
      <input class="field-input" id="newLugItem" placeholder="物品名稱">
      <div class="btn jade" onclick="addLug()">＋</div>
    </div>
  `;
  return html;
}
function toggleLug(id){
  const it = state.luggage.find(x=>x.id===id);
  it.checked = !it.checked;
  save(); render();
}
function lug_upd(id, field, val){
  const it = state.luggage.find(x=>x.id===id);
  it[field]=val; save();
}
function addLug(){
  const g = document.getElementById("newLugGroup").value.trim() || "其他";
  const n = document.getElementById("newLugItem").value.trim();
  if(!n) return showToast("請輸入物品名稱");
  state.luggage.push({id:uid(), group:g, item:n, checked:false});
  save(); render();
}
function delLug(id){
  state.luggage = state.luggage.filter(x=>x.id!==id);
  save("已刪除"); render();
}

/* ============ 分帳 ============ */
function billingView(){
  const b = state.billing;
  const totalCount = b.members.reduce((s,m)=>s+(Number(m.count)||0),0) || 1;
  const totalDeposit = b.members.reduce((s,m)=>s+(Number(m.deposit)||0),0);
  const totalSpent = b.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);

  let html = `
    <div class="section-title"><span class="bar"></span>分帳記帳</div>
    <p class="section-desc">每人先繳訂金，花費從公帳支出，最後多退少補<br>※ 個人花費（自己買的東西）不列入記帳</p>
    <div class="sync-badge">☁️ 已同步（大家都看得到）</div>
    <div class="btn jade block" onclick="exportCsv()" style="margin-bottom:22px">📊 匯出成 CSV</div>

    <div class="section-title" style="font-size:17px">成員</div>
    <div class="member-row">
      ${b.members.map(m=>`<div class="member-pill">${escapeHtml(m.name)}${editMode?`<div class="x" onclick="delMember('${m.id}')">✕</div>`:""}</div>`).join("")}
    </div>
    <div class="member-add">
      <input class="field-input" id="newMemberName" placeholder="輸入姓名，例如：小美">
      <div class="btn vermillion" onclick="addMember()">加入</div>
    </div>

    <div class="section-title" style="font-size:17px">各家人數與訂金</div>
    <p class="section-desc">公帳花費會依各家人數比例分攤</p>
  `;
  b.members.forEach(m=>{
    html += `
    <div class="fam-card">
      <div class="fam-top">
        <div class="fam-name">${escapeHtml(m.name)} <span class="cnt">${m.count||0} 人</span></div>
      </div>
      <div class="fam-fields">
        <div><label>人數</label><input type="number" value="${m.count}" onchange="m_upd('${m.id}','count',this.value)"></div>
        <div><label>已繳訂金 ¥</label><input type="number" value="${m.deposit}" onchange="m_upd('${m.id}','deposit',this.value)"></div>
      </div>
    </div>`;
  });

  html += `
    <div class="section-title" style="font-size:17px;margin-top:22px">公帳花費紀錄</div>
  `;
  if(b.expenses.length===0){
    html += `<div class="empty">還沒有任何花費紀錄</div>`;
  }
  b.expenses.forEach(e=>{
    const payerOpts = b.members.map(m=>`<option value="${m.id}" ${m.id===e.payer?"selected":""}>${escapeHtml(m.name)}</option>`).join("");
    html += `
    <div class="expense-row">
      <div class="r1">
        <input type="text" value="${escapeHtml(e.desc)}" placeholder="項目說明" onchange="e_upd('${e.id}','desc',this.value)">
        <input type="number" value="${e.amount}" placeholder="金額" onchange="e_upd('${e.id}','amount',this.value)">
      </div>
      <div class="r2">
        <span style="font-size:12px;color:var(--ink-soft)">誰先付的</span>
        <select onchange="e_upd('${e.id}','payer',this.value)">${payerOpts}</select>
        ${editMode?`<div class="del" onclick="delExpense('${e.id}')">刪除</div>`:""}
      </div>
    </div>`;
  });
  html += `<div class="btn block" onclick="addExpense()" style="margin:14px 0 8px">＋ 新增一筆花費</div>`;

  html += `
    <div class="totals">
      <div class="stat" style="flex:1;border:2px solid var(--line);border-radius:14px;background:var(--card)"><div class="k">已收訂金</div><div class="v">${fmtMoney(totalDeposit)}</div></div>
      <div class="stat" style="flex:1;border:2px solid var(--line);border-radius:14px;background:var(--card)"><div class="k">公帳已花</div><div class="v" style="color:var(--vermillion)">${fmtMoney(totalSpent)}</div></div>
    </div>

    <div class="settle-card">
      <div class="settle-head">💸 結算：多退少補</div>
  `;
  b.members.forEach(m=>{
    const share = totalSpent * ((Number(m.count)||0)/totalCount);
    const net = (Number(m.deposit)||0) - share;
    const isRefund = net >= 0;
    html += `
      <div class="settle-row">
        <div class="nm">${escapeHtml(m.name)}　<span style="font-weight:400;color:var(--ink-soft);font-size:11px">應分攤 ${fmtMoney(share)}</span></div>
        <div class="amt ${isRefund?'refund':'owe'}">${isRefund?'退 ':'補 '}${fmtMoney(Math.abs(net))}</div>
      </div>`;
  });
  html += `</div>`;
  return html;
}
function m_upd(id, field, val){
  const m = state.billing.members.find(x=>x.id===id);
  m[field] = field==="name" ? val : Number(val);
  save(); render();
}
function addMember(){
  const nameInput = document.getElementById("newMemberName");
  const name = nameInput.value.trim();
  if(!name) return showToast("請輸入姓名");
  state.billing.members.push({id:uid(), name, count:1, deposit:0});
  save(); render();
}
function delMember(id){
  state.billing.members = state.billing.members.filter(x=>x.id!==id);
  save("已刪除"); render();
}
function e_upd(id, field, val){
  const e = state.billing.expenses.find(x=>x.id===id);
  e[field] = field==="amount" ? Number(val) : val;
  save(); render();
}
function addExpense(){
  const firstMember = state.billing.members[0];
  state.billing.expenses.push({id:uid(), desc:"", amount:0, payer: firstMember?firstMember.id:""});
  save(); render();
}
function delExpense(id){
  state.billing.expenses = state.billing.expenses.filter(x=>x.id!==id);
  save("已刪除"); render();
}
function exportCsv(){
  const b = state.billing;
  const totalCount = b.members.reduce((s,m)=>s+(Number(m.count)||0),0) || 1;
  const totalSpent = b.expenses.reduce((s,e)=>s+(Number(e.amount)||0),0);
  let rows = [["項目","金額","付款人"]];
  b.expenses.forEach(e=>{
    const payer = b.members.find(m=>m.id===e.payer);
    rows.push([e.desc, e.amount, payer?payer.name:""]);
  });
  rows.push([]);
  rows.push(["家庭","人數","已繳訂金","應分攤","應退／應補"]);
  b.members.forEach(m=>{
    const share = totalSpent * ((Number(m.count)||0)/totalCount);
    const net = (Number(m.deposit)||0) - share;
    rows.push([m.name, m.count, m.deposit, share.toFixed(0), (net>=0?"退 ":"補 ")+Math.abs(net).toFixed(0)]);
  });
  const csv = rows.map(r=>r.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "分帳記錄.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("已匯出 CSV");
}

/* ============ 標題 / 副標編輯 ============ */
document.getElementById("tripTitleView").addEventListener("blur", function(){
  state.meta.title = this.innerText.trim() || "未命名旅程";
  save();
});
document.getElementById("tripSub").addEventListener("change", function(){
  state.meta.sub = this.value; save();
});
document.getElementById("baseNote").addEventListener("change", function(){
  state.meta.base = this.value; save();
});

document.getElementById("stampBtn").addEventListener("click", function(){
  editMode = !editMode;
  showToast(editMode ? "編輯模式：可刪除項目" : "編輯模式已關閉");
  render();
});

load();
</script>
